<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Active & App Password Checker</title>
    <style>
        /* CSS স্টাইল এখানে */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #218838;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gmail Checker</h2>
    <form id="checkerForm">
        <div class="input-group">
            <label>Gmail Address:</label>
            <input type="email" id="email" required placeholder="example@gmail.com">
        </div>
        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="password" placeholder="Account Password">
        </div>
        <div class="input-group">
            <label>2FA Code:</label>
            <input type="text" id="twoFa" placeholder="G-XXXXXX or Backup Code">
        </div>
        <div class="input-group">
            <label>App Password (16 chars):</label>
            <input type="text" id="appPassword" required placeholder="abcd efgh ijkl mnop">
        </div>
        <button type="submit" id="submitBtn">Check Status</button>
    </form>

    <div id="result" class="result hidden"></div>
</div>

<script>
    /* JavaScript কোড এখানে */
    document.getElementById('checkerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const appPassword = document.getElementById('appPassword').value;
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        
        submitBtn.innerText = "Checking...";
        submitBtn.disabled = true;
        resultDiv.className = "result hidden";

        try {
            const response = await fetch('/api/check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, app_password: appPassword })
            });
            
            const data = await response.json();
            
            resultDiv.innerText = data.message;
            if (data.status === 'success') {
                resultDiv.className = "result success";
            } else {
                resultDiv.className = "result error";
            }
        } catch (error) {
            resultDiv.innerText = "সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না।";
            resultDiv.className = "result error";
        } finally {
            submitBtn.innerText = "Check Status";
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
