<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail App Password Checker</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #a0c3ff;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Gmail Checker</h2>
    <div class="form-group">
        <label for="email">Gmail Address:</label>
        <input type="email" id="email" placeholder="example@gmail.com">
    </div>
    <div class="form-group">
        <label for="password">App Password:</label>
        <input type="text" id="password" placeholder="xxxx xxxx xxxx xxxx">
    </div>
    <button id="checkBtn" onclick="checkAuth()">Check</button>
    <div id="result"></div>
</div>

<script>
    async function checkAuth() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const resultDiv = document.getElementById('result');
        const btn = document.getElementById('checkBtn');

        if (!email || !password) {
            resultDiv.className = 'error';
            resultDiv.innerText = 'দয়া করে দুটি ঘরই পূরণ করুন!';
            resultDiv.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.innerText = 'যাচাই করা হচ্ছে...';
        resultDiv.style.display = 'none';

        try {
            const response = await fetch('/check-credentials', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await response.json();
            resultDiv.style.display = 'block';

            if (data.success) {
                resultDiv.className = 'success';
                resultDiv.innerText = data.message;
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = data.message;
            }
        } catch (err) {
            resultDiv.className = 'error';
            resultDiv.innerText = 'সার্ভারে সংযোগ করা সম্ভব হয়নি!';
            resultDiv.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerText = 'Check';
        }
    }
</script>

</body>
</html>
